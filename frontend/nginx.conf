server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Если у тебя API ходит по /api — это всё проксируется Traefik-ом,
    # nginx внутри фронта про /api вообще можно не знать.
    # Но на всякий случай можно явно отдать 404, чтобы не мешаться:
    location /api/ {
        return 404;
    }

    # Главный кусок для SPA:
    location / {
        try_files $uri /index.html;
    }
}